<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="mb-4">
                    <a href="/products" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại cửa hàng</a>
                </div>
                
                <div class="card border-0 shadow-sm overflow-hidden">
                    <div class="row g-0">
                        <div class="col-md-5 d-flex align-items-center justify-content-center p-5" style="background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);">
                            <i class="bi bi-box-seam" style="font-size: 5rem; color: #6366f1;"></i>
                        </div>
                        <div class="col-md-7 p-4">
                            <div class="card-body p-2 d-flex flex-column h-100">
                                <div>
                                    <span class="badge-custom badge-info mb-2 text-uppercase" th:text="${product.code}"></span>
                                    <h2 class="card-title fw-bold text-dark mb-3" th:text="${product.name}"></h2>
                                    
                                    <div class="mb-4">
                                        <span class="text-secondary small d-block">Giá bán lẻ:</span>
                                        <h3 class="text-primary fw-extrabold" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></h3>
                                    </div>
                                    
                                    <hr class="text-muted opacity-25">
                                    
                                    <div class="mb-4">
                                        <div class="row text-secondary small">
                                            <div class="col-6 mb-2">
                                                <span>Trạng thái kho:</span>
                                                <div th:class="${product.quantity > 0} ? 'text-success fw-semibold mt-1' : 'text-danger fw-semibold mt-1'">
                                                    <i class="bi bi-circle-fill me-1" style="font-size: 0.6rem;"></i>
                                                    <span th:text="${product.quantity > 0} ? 'Còn hàng (' + ${product.quantity} + ')' : 'Đã hết hàng'"></span>
                                                </div>
                                            </div>
                                            <div class="col-6 mb-2">
                                                <span>Ngày nhập kho:</span>
                                                <div class="text-dark fw-semibold mt-1" th:text="${#strings.substring(product.createdAt, 0, 10)}"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="mt-auto pt-3">
                                    <div th:if="${product.quantity > 0}">
                                        <div class="d-flex gap-3 align-items-end">
                                            <div style="width: 100px;">
                                                <label for="quantity" class="form-label">Số lượng</label>
                                                <input type="number" id="quantity" class="form-control text-center" min="1" th:max="${product.quantity}" value="1">
                                            </div>
                                            <button id="add-btn" th:data-product-id="${product.id}" class="btn btn-primary flex-grow-1 py-3 d-flex align-items-center justify-content-center">
                                                <i class="bi bi-cart-plus-fill me-2"></i> Thêm vào giỏ hàng
                                            </button>
                                        </div>
                                    </div>
                                    <div th:unless="${product.quantity > 0}" class="alert alert-danger py-3 rounded-3 text-center mb-0 fw-bold">
                                        Rất tiếc! Mặt hàng này hiện đã hết hàng
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        $(document).ready(function() {
            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");

            $('#add-btn').click(function() {
                var productId = $(this).data('product-id');
                var quantity = $('#quantity').val();
                
                if (parseInt(quantity) < 1) {
                    showToast('Cảnh báo', 'Vui lòng nhập số lượng hợp lệ', 'warning');
                    return;
                }
                
                $.ajax({
                    url: '/cart/add',
                    type: 'POST',
                    data: {
                        productId: productId,
                        quantity: quantity
                    },
                    beforeSend: function(xhr) {
                        xhr.setRequestHeader(header, token);
                    },
                    success: function() {
                        showToast('Thành công', 'Đã thêm sản phẩm vào giỏ hàng', 'success');
                    },
                    error: function(xhr) {
                        showToast('Thất bại', xhr.responseText || 'Không thể thêm sản phẩm', 'danger');
                    }
                });
            });
        });
    </script>
</body>
</html>
