<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card border-0 shadow-lg text-center p-5 rounded-4 mt-4">
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-danger-light text-danger rounded-circle" style="width: 80px; height: 80px;">
                            <i class="bi bi-exclamation-triangle" style="font-size: 3.5rem;"></i>
                        </div>
                    </div>

                    <h3 class="fw-extrabold text-dark mb-2">
                        <span th:text="${status} ?: 'Lỗi'">Lỗi</span>
                        <span class="text-secondary fs-6 d-block mt-1" th:text="${error}">Đã xảy ra lỗi</span>
                    </h3>
                    <p class="text-secondary mb-5 small" th:text="${message} ?: 'Đã có lỗi xảy ra, vui lòng thử lại sau.'">
                        Đã có lỗi xảy ra, vui lòng thử lại sau.
                    </p>

                    <div class="d-grid gap-3">
                        <a href="/products" class="btn btn-primary py-3 rounded-3"><i class="bi bi-house-door-fill me-2"></i> Về trang sản phẩm</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
