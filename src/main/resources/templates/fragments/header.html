<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Bán Hàng</title>
    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Style CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Global Notifications Script -->
    <script>
        function showToast(title, message, type = 'info') {
            var container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }
            
            var icon = 'info-circle';
            if (type === 'success') icon = 'check-circle-fill';
            else if (type === 'danger') icon = 'exclamation-circle-fill';
            else if (type === 'warning') icon = 'exclamation-triangle-fill';
            
            var toast = document.createElement('div');
            toast.className = `custom-toast ${type}`;
            toast.innerHTML = `
                <div class="toast-icon"><i class="bi bi-${icon}"></i></div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()"><i class="bi bi-x"></i></button>
            `;
            
            container.appendChild(toast);
            
            setTimeout(function() {
                toast.style.animation = 'toast-out 0.3s ease forwards';
                setTimeout(function() {
                    toast.remove();
                }, 300);
            }, 3500);
        }
    </script>
</head>
<body>
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark glass-navbar sticky-top">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="/">
                    <i class="bi bi-speedometer2 me-2"></i> POS-BANHANG
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/products">
                                <i class="bi bi-grid-3x3-gap-fill me-1"></i> Sản phẩm
                            </a>
                        </li>
                        
                        <!-- Admin Menu -->
                        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                            <a class="nav-link" href="/stock">
                                <i class="bi bi-box-seam me-1"></i> Quản lý kho
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'STAFF')">
                            <a class="nav-link" href="/customers">
                                <i class="bi bi-people me-1"></i> Khách hàng
                            </a>
                        </li>
                        
                        <!-- Staff Menu -->
                        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'STAFF')">
                            <a class="nav-link" href="/order">
                                <i class="bi bi-receipt me-1"></i> Hóa đơn
                            </a>
                        </li>
                    </ul>
                    
                    <!-- User Menu -->
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item me-3" sec:authorize="isAuthenticated()">
                            <span class="text-light opacity-90 d-flex align-items-center">
                                <i class="bi bi-person-badge-fill me-1 text-primary-light"></i>
                                <span sec:authentication="principal.fullName" class="fw-semibold"></span>
                            </span>
                        </li>
                        <li class="nav-item me-2">
                            <a class="btn btn-sm btn-primary px-3 d-flex align-items-center" href="/cart">
                                <i class="bi bi-cart3 me-1"></i> Giỏ hàng
                            </a>
                        </li>
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="btn btn-sm btn-outline-light px-3" href="/login">Đăng nhập</a>
                        </li>
                        <li class="nav-item" sec:authorize="isAuthenticated()">
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-danger px-3">
                                    <i class="bi bi-box-arrow-right me-1"></i> Thoát
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- Toast container element -->
        <div id="toast-container"></div>
    </header>
</body>
</html>
