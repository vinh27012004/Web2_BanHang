<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Hệ thống Bán Hàng</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Style CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            color: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
        }
        .login-card .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        .login-card .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.25);
        }
        .login-card .form-label {
            color: #cbd5e1;
        }
        .login-logo {
            font-size: 3rem;
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-5">
            <div class="login-logo mb-2"><i class="bi bi-speedometer2"></i></div>
            <h3 class="fw-bold tracking-tight">Hệ Thống Bán Hàng</h3>
            <p class="text-secondary-light opacity-75 small">Nhập tài khoản để bắt đầu ca làm việc</p>
        </div>
        
        <div th:if="${param.error}" class="alert alert-danger border-0 bg-danger bg-opacity-20 text-white rounded-3 small py-2 px-3 mb-4 d-flex align-items-center">
            <i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>
            Tên đăng nhập hoặc mật khẩu không chính xác
        </div>
        
        <form th:action="@{/login}" method="post">
            <div class="mb-4">
                <label for="username" class="form-label">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted border-white border-opacity-10"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Nhập username..." required autofocus>
                </div>
            </div>
            
            <div class="mb-5">
                <label for="password" class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-muted border-white border-opacity-10"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Nhập mật khẩu..." required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 d-flex align-items-center justify-content-center">
                <i class="bi bi-box-arrow-in-right me-2"></i> Đăng nhập hệ thống
            </button>
        </form>
    </div>
</body>
</html>
