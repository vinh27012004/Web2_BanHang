<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-5">
            <div>
                <h1 class="page-title">Quản lý Khách hàng</h1>
                <p class="page-subtitle mb-0">Quản lý danh sách khách hàng thành viên và lịch sử giao dịch tương ứng</p>
            </div>
            <div>
                <a href="/customers/add" class="btn btn-primary d-flex align-items-center">
                    <i class="bi bi-person-plus-fill me-2"></i> Đăng ký khách hàng mới
                </a>
            </div>
        </div>

        <!-- Bộ tìm kiếm khách hàng -->
        <div class="card border-0 shadow-sm mb-5 p-4 bg-white">
            <h6 class="fw-bold text-dark mb-3"><i class="bi bi-funnel-fill text-primary me-2"></i> Tra cứu nhanh</h6>
            <form th:action="@{/customers/search}" method="get">
                <div class="row g-3">
                    <div class="col-md-9">
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-end-0 text-muted"><i class="bi bi-phone"></i></span>
                            <input type="text" name="phone" class="form-control border-start-0 ps-0" placeholder="Nhập số điện thoại khách hàng cần tìm...">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search me-1"></i> Tìm kiếm</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Bảng danh sách khách hàng -->
        <div class="table-container border-0 shadow-sm">
            <table class="table">
                <thead>
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th>Họ và tên</th>
                        <th>Số điện thoại</th>
                        <th>Địa chỉ Email</th>
                        <th class="text-center" style="width: 150px;">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="customer : ${customers}">
                        <td class="fw-bold text-secondary" th:text="'#' + ${customer.id}"></td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="bg-light rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 36px; height: 36px;">
                                    <i class="bi bi-person-fill text-secondary"></i>
                                </div>
                                <span class="fw-bold text-dark" th:text="${customer.name}"></span>
                            </div>
                        </td>
                        <td class="fw-semibold" th:text="${customer.phone}"></td>
                        <td class="text-muted" th:text="${customer.email != null && !customer.email.isEmpty() ? customer.email : 'Chưa có email'}"></td>
                        <td>
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{/customers/edit/{id}(id=${customer.id})}" class="btn btn-sm btn-warning d-inline-flex align-items-center" title="Sửa thông tin">
                                    <i class="bi bi-pencil-fill"></i>
                                </a>
                                <form th:action="@{/customers/delete/{id}(id=${customer.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-danger d-inline-flex align-items-center" onclick="return confirm('Bạn có chắc chắn muốn xóa khách hàng này không?')" title="Xóa">
                                        <i class="bi bi-trash-fill"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(customers)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="bi bi-people-fill mb-3" style="font-size: 2rem; display: block;"></i>
                            Không có khách hàng nào được tìm thấy.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
