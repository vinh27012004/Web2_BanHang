<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="mb-4">
                    <a href="/customers" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại danh sách</a>
                </div>
                
                <div class="card border-0 shadow-sm overflow-hidden">
                    <div class="card-header bg-light py-3 border-0">
                        <h4 class="card-title fw-bold text-dark mb-0 d-flex align-items-center">
                            <i class="bi bi-person-bounding-box text-primary me-2"></i>
                            <span th:text="${customer.id == null ? 'Đăng ký khách hàng mới' : 'Cập nhật thông tin khách hàng'}"></span>
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${customer.id == null ? '/customers/add' : '/customers/edit/' + customer.id}"
                              th:object="${customer}" method="post">
                            
                            <div class="mb-3">
                                <label for="name" class="form-label">Tên khách hàng *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="name" th:field="*{name}" placeholder="Nhập họ và tên..." required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="phone" class="form-label">Số điện thoại liên hệ *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-phone-fill"></i></span>
                                    <input type="tel" class="form-control border-start-0 ps-0" id="phone" th:field="*{phone}" placeholder="Nhập số điện thoại..." required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="email" class="form-label">Địa chỉ Email (Tùy chọn)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope-fill"></i></span>
                                    <input type="email" class="form-control border-start-0 ps-0" id="email" th:field="*{email}" placeholder="Nhập địa chỉ email...">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>
                            
                            <div class="d-flex gap-3">
                                <a href="/customers" class="btn btn-outline-secondary py-3 flex-grow-1 text-center">Hủy bỏ</a>
                                <button type="submit" class="btn btn-primary py-3 flex-grow-2"><i class="bi bi-save2-fill me-1"></i> Lưu thông tin</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
