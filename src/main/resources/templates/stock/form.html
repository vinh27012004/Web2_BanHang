<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="mb-4">
                    <a href="/stock" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại kho</a>
                </div>
                
                <div class="card border-0 shadow-sm overflow-hidden">
                    <div class="card-header bg-light py-3 border-0">
                        <h4 class="card-title fw-bold text-dark mb-0 d-flex align-items-center">
                            <i class="bi bi-box-arrow-in-down text-primary me-2"></i> Tạo phiếu nhập kho mới
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/stock/add}" th:object="${entry}" method="post">
                            <!-- Chọn sản phẩm -->
                            <div class="mb-3">
                                <label for="product" class="form-label">Sản phẩm cần nhập *</label>
                                <select class="form-select" id="product" th:field="*{product}" required>
                                    <option value="">-- Chọn sản phẩm trong kho --</option>
                                    <option th:each="product : ${products}"
                                            th:value="${product.id}"
                                            th:text="${product.name + ' - [' + product.code + ']' + ' (Hiện có: ' + product.quantity + ')'}">
                                    </option>
                                </select>
                            </div>
                            
                            <!-- Số lượng -->
                            <div class="mb-3">
                                <label for="quantity" class="form-label">Số lượng nhập hàng *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-boxes"></i></span>
                                    <input type="number" class="form-control border-start-0 ps-0" id="quantity" th:field="*{quantity}" required min="1" placeholder="Nhập số lượng hàng thêm vào kho...">
                                </div>
                            </div>
                            
                            <!-- Ghi chú -->
                            <div class="mb-4">
                                <label for="note" class="form-label">Ghi chú nhập kho (Tùy chọn)</label>
                                <textarea class="form-control" id="note" th:field="*{note}" rows="3" placeholder="Ví dụ: Nhập hàng nhà cung cấp A, bổ sung hàng bị lỗi..."></textarea>
                            </div>
                            
                            <div class="d-flex gap-3">
                                <a href="/stock" class="btn btn-outline-secondary py-3 flex-grow-1 text-center">Hủy bỏ</a>
                                <button type="submit" class="btn btn-primary py-3 flex-grow-2"><i class="bi bi-check-lg me-1"></i> Xác nhận nhập kho</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
