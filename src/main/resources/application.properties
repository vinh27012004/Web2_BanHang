# Database Configuration
# Các giá trị nhạy cảm được đọc từ biến môi trường, có giá trị mặc định cho môi trường dev.
# Có thể ghi đè bằng biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD
# hoặc tạo file application-local.properties (đã được .gitignore bỏ qua).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banhang}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Main class configuration
spring.main.allow-bean-definition-overriding=true